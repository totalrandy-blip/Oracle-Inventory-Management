<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1Z0-1073-26 Inventory Cloud study notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#1C2B3A; --muted:#5B6B7B; --line:#C9D2DB;
  --mark:#F2C230; --mark-soft:#FCF3D2; --ok:#2E7D5B; --ok-soft:#E3F2EA; --bad:#B3412E; --bad-soft:#F7E4E0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141B23; --surface:#1C2530; --ink:#E4EAF0; --muted:#98A6B4; --line:#2E3B49;
    --mark:#E8B923; --mark-soft:#3A3219; --ok:#5CC08F; --ok-soft:#1B3328; --bad:#E07A66; --bad-soft:#3A221D;
  }
}
:root[data-theme="dark"]{
  --paper:#141B23; --surface:#1C2530; --ink:#E4EAF0; --muted:#98A6B4; --line:#2E3B49;
  --mark:#E8B923; --mark-soft:#3A3219; --ok:#5CC08F; --ok-soft:#1B3328; --bad:#E07A66; --bad-soft:#3A221D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font:700 26px/1 var(--display);letter-spacing:.01em;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.domain{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;
  padding:8px 10px;margin:2px 0;border-radius:0 6px 6px 0;cursor:pointer;font-size:15px;line-height:1.35}
.domain:hover{background:var(--surface)}
.domain[aria-current="true"]{border-left-color:var(--mark);background:var(--surface);font-weight:700}
.domain[disabled]{color:var(--muted);cursor:default;background:none}
.domain small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.theme{margin-top:24px;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px}

main{padding:40px clamp(18px,5vw,64px) 80px;max-width:860px}
h1{font:600 clamp(40px,6vw,60px)/1 var(--display);margin:0 0 12px;letter-spacing:-.005em}
.lede{color:var(--muted);margin:0 0 20px;max-width:62ch}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 36px;padding:0;list-style:none}
.topics li{font-size:14px;border:1px solid var(--line);border-radius:4px;padding:3px 9px;background:var(--surface)}
h2{font:600 30px/1.1 var(--display);margin:44px 0 14px}
h3{font-size:18px;margin:0 0 6px}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 12px}
details.sec summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font:600 22px/1 var(--display);color:var(--muted)}
details.sec[open] summary::after{content:"−"}
.sec-body{padding:0 18px 16px}
.sec-body ul{padding-left:20px;margin:6px 0}
.sec-body li{margin:4px 0}
.src{color:var(--muted);font-size:13px;margin-top:10px}
.focus{border-left:6px solid var(--mark);background:var(--mark-soft);padding:10px 14px;margin:12px 0 4px;border-radius:0 6px 6px 0}
.focus b{display:block;font-size:14px}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:15px;min-width:420px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{font-weight:700}

.quiz-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.best{color:var(--muted);font-size:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin:0 0 14px}
.q-n{font:600 15px/1 var(--display);color:var(--muted);margin-bottom:6px}
.q p{margin:0 0 12px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:6px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.explain{margin-top:10px;font-size:15px}
.explain strong{color:var(--ok)}
.explain.no strong{color:var(--bad)}
.score{position:sticky;bottom:12px;background:var(--ink);color:var(--paper);border-radius:8px;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.score button{background:var(--mark);color:#1C2B3A;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}

.menu-btn{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;background:var(--paper);z-index:10;
      transform:translateX(-100%);transition:transform .2s;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  nav.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin-bottom:20px;cursor:pointer}
  main{padding-top:20px}
}
@media (prefers-reduced-motion:reduce){nav{transition:none}}

.nav-practice{font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin:0 0 16px}
.panel h3{margin-bottom:10px}
.choice{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.choice:hover{background:var(--paper)}
.choice input{accent-color:var(--ink);width:18px;height:18px}
.choice span.c{margin-left:auto;color:var(--muted);font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.primary{background:var(--mark);color:#1C2B3A;border:0;border-radius:6px;padding:12px 22px;font-weight:700;cursor:pointer;font-size:17px}
.secondary{background:none;border:1px solid var(--line);border-radius:6px;padding:11px 18px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:15px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--mark);transition:width .2s}
.tag{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-bottom:10px}
.big{font:600 72px/1 var(--display);margin:6px 0}
.miss{border-left:4px solid var(--bad);padding:6px 12px;margin:10px 0;background:var(--surface);border-radius:0 6px 6px 0;font-size:15px}
.miss b{display:block}
.note{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.dhead{font:600 17px/1.2 var(--display);color:var(--muted);margin:18px 0 4px 10px;letter-spacing:.01em}
.dhead.off{opacity:.55}
.domain .pct{float:right;font-size:12px;color:var(--muted);font-weight:400}
select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.gap{border-left:6px solid var(--muted);background:var(--paper);padding:10px 14px;margin:12px 0;border-radius:0 6px 6px 0;font-size:15px}

dfn.term{font-style:normal;border-bottom:2px dotted var(--mark);cursor:help}
dfn.term:hover,dfn.term:focus{background:var(--mark-soft);outline:none}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));
  background:var(--ink);color:var(--paper);border-radius:8px;padding:14px 44px 14px 16px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:16px}
#tip b{display:block;font:600 20px/1.2 var(--display);margin-bottom:4px;color:var(--mark)}
#tip button{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--paper);font-size:22px;cursor:pointer;line-height:1}
.gl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 8px}
.gl b{display:block}
.gl small{color:var(--muted)}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);margin-bottom:16px}
dl.kt{margin:0}dl.kt dt{font-weight:700;margin-top:10px}dl.kt dd{margin:2px 0 0}

.lab{border:1px dashed var(--muted);background:var(--paper);border-radius:6px;padding:10px 14px 8px;margin:14px 0 4px;font-size:15px}
.lab>b{display:block;font:600 17px/1.2 var(--display);letter-spacing:.02em;text-transform:uppercase;margin-bottom:4px}
.lab>b::before{content:"";display:inline-block;width:10px;height:10px;background:var(--mark);margin-right:8px;vertical-align:1px}
.lab ul,.lab ol{padding-left:20px;margin:4px 0}.lab p{margin:6px 0}
.lab>small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.eyebrow{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
details.xsec{margin:6px 0}details.xsec>summary{cursor:pointer;list-style:none;font:600 17px/1.25 var(--display);padding:8px 10px;border-radius:6px}
details.xsec>summary::-webkit-details-marker{display:none}details.xsec>summary::before{content:"+";display:inline-block;width:16px;color:var(--muted)}
details.xsec[open]>summary::before{content:"−"}details.xsec>summary:hover{background:var(--surface)}
details.xsec .dhead{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px 26px}
details.xsec .domain{padding-left:26px;font-size:14px}
.link{display:block;background:none;border:0;padding:6px 0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;text-align:left}
.tsum{display:grid;gap:6px;margin:6px 0 18px}.tsum button{text-align:left}

.opt.pick{border-color:var(--ink);background:var(--mark-soft)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt .box{display:inline-block;width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;margin-right:10px;vertical-align:-3px}
.opt.pick .box{background:var(--ink);border-color:var(--ink)}
.opt.radio .box{border-radius:50%}
.choose{display:inline-block;font:600 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:4px;padding:5px 9px;margin:0 0 10px}
.srcnote{color:var(--muted);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Study navigation">
    <p class="brand">1Z0-1073-26</p>
    <p class="brand-sub">Inventory Cloud 2026 Implementation Professional</p>
    <button class="domain nav-practice" data-v="practice">Practice exam<small>Random questions from the library</small></button>
    <button class="domain nav-gen" data-v="gen">Guide question generator<small>New questions from the Oracle guides</small></button>
    <button class="domain nav-gloss" data-v="glossary">Glossary<small>All terms explained</small></button>
    <div id="domains"></div>
    <button class="theme" id="theme">Switch light / dark</button>
  </nav>
  <main id="main"></main>
</div>
<div id="tip" role="dialog" aria-live="polite" hidden></div>
<script>
/* ---------- data registry (data files call MOD and QS) ---------- */
const STUDY={domains:[
  {id:"d1",title:"Enterprise structures"},
  {id:"d2",title:"Inventory management"},
  {id:"d3",title:"Inventory transactions"},
  {id:"d4",title:"Executing transactions"},
  {id:"d5",title:"Advanced transactions"},
  {id:"d6",title:"Replenishment"},
  {id:"d7",title:"Inventory counts"},
  {id:"d8",title:"AI, mobile & Redwood"}
],modules:[],bank:[]};
function MOD(m){STUDY.modules.push(m)}
function EXAMDEF(ex,qt,qd){STUDY.exam=ex.map((s,si)=>({i:si,title:s[0],groups:s[1].map(g=>({title:g[0],topics:g[1].map(t=>({id:t[0],title:t[1],refs:t[2]||[],rel:t[3]||[],note:t[4]||"",s:si,g:g[0]}))}))}));STUDY.topics=STUDY.exam.flatMap(s=>s.groups.flatMap(g=>g.topics));STUDY.qt=qt;STUDY.qd=qd}
function GEN(src,list){(STUDY.gen=STUDY.gen||[]);list.forEach(x=>STUDY.gen.push({...x,src,id:"g"+STUDY.gen.length}))}
function GLOSS(list){STUDY.gloss=list.map(x=>({t:x[0],d:x[1],a:x[2]||[]})).sort((a,b)=>a.t.localeCompare(b.t))}
/* questions: [question, [correct, wrong, wrong, ...], explanation]. Correct is always first; options are shuffled at runtime. */
function QS(mid,list){const m=STUDY.modules.find(x=>x.id===mid);list.forEach((x,i)=>STUDY.bank.push({id:mid+"-"+(i+1),m:mid,d:m.d,q:x[0],o:x[1],a:0,e:x[2]}))}
</script>
<script src="data/glossary.js"></script>
<script src="data/d1.js"></script>
<script src="data/d2.js"></script>
<script src="data/d3.js"></script>
<script src="data/d4.js"></script>
<script src="data/d5.js"></script>
<script src="data/d6d7.js"></script>
<script src="data/d8.js"></script>
<script src="data/exam.js"></script>
<script src="data/docgen.js"></script>
<script>
/* ================= SHELL ================= */
const topOf=id=>STUDY.topics.find(t=>t.id===id);
STUDY.bank.forEach(q=>{q.t=STUDY.qt[q.id]||STUDY.qd[q.m];q.s=topOf(q.t).s});
const shortG=g=>/^Explain/.test(g)?"Explain":/^Configure/.test(g)?"Configure":/^Execute/.test(g)?"Execute":g;


const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dom=id=>STUDY.domains.find(d=>d.id===id);
const modOf=id=>STUDY.modules.find(m=>m.id===id);
let view={v:"practice"}, setup={scope:"all",size:30,topic:""}, run=null;

function missed(){return store.get("missed")||[]}
function markResult(id,ok){let m=new Set(missed());ok?m.delete(id):m.add(id);store.set("missed",[...m])}
function pool(scope){
  if(scope==="all") return STUDY.bank;
  if(scope==="missed"){const m=new Set(missed());return STUDY.bank.filter(q=>m.has(q.id))}
  if(scope.startsWith("t:")) return STUDY.bank.filter(q=>q.t===scope.slice(2));
  if(scope.startsWith("s:")) return STUDY.bank.filter(q=>q.s===+scope.slice(2));
  return [];
}
function scopeLabel(s){return s==="all"?"Full exam":s==="missed"?"Questions I got wrong":s.startsWith("t:")?topOf(s.slice(2)).title:STUDY.exam[+s.slice(2)].title}

function renderNav(){
  const best=store.get("best")||{}, cur=view.v==="topic"?topOf(view.id):null;
  $("#domains").innerHTML=STUDY.exam.map(x=>`<details class="xsec" ${cur&&cur.s===x.i?"open":""}><summary>${x.title}</summary>`+
    x.groups.map(g=>(g.title?`<p class="dhead">${shortG(g.title)}</p>`:"")+g.topics.map(t=>{const b=best["t:"+t.id];
      return `<button class="domain" data-t="${t.id}" aria-current="${!!(cur&&cur.id===t.id)}">${t.title}${b!=null?`<span class="pct">${b}%</span>`:""}</button>`}).join("")).join("")+`</details>`).join("");
  document.querySelector(".nav-practice").setAttribute("aria-current",view.v==="practice"||view.v==="run"||view.v==="result");document.querySelector(".nav-gloss").setAttribute("aria-current",view.v==="glossary");const ng=document.querySelector(".nav-gen");if(ng)ng.setAttribute("aria-current",/^gen/.test(view.v));
  document.querySelectorAll(".domain[data-t]").forEach(b=>b.onclick=()=>go({v:"topic",id:b.dataset.t}));
}
function go(v){view=v;renderNav();({topic:renderTopic,practice:renderSetup,run:renderRun,result:renderResult,glossary:renderGlossary,gen:renderGenSetup,genrun:renderGenRun,genresult:renderGenResult})[v.v]();$("#tip").hidden=true;$("#nav").classList.remove("open");window.scrollTo(0,0)}
/*MB*/const menuBtn=`<button class="menu-btn" onclick="document.getElementById('nav').classList.add('open')">Menu</button>`;

/* ---------- glossary highlighting ---------- */
const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");
const GPAT=(STUDY.gloss||[]).flatMap((g,i)=>[g.t,...g.a].map(n=>({i,n,re:new RegExp("(^|[^A-Za-z0-9])("+esc(n)+"(?:e?s)?)(?![A-Za-z0-9])",/[a-z]/.test(n)?"i":"")}))).sort((x,y)=>y.n.length-x.n.length);
function annotate(root,found){
  root.querySelectorAll(".sec-body").forEach(sec=>{
    const used=new Set();
    for(const p of GPAT){
      if(used.has(p.i)) continue;
      const w=document.createTreeWalker(sec,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("dfn,figure,.src,.gap")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
      let n;
      while((n=w.nextNode())){
        const m=p.re.exec(n.nodeValue); if(!m) continue;
        const start=m.index+m[1].length, word=m[2];
        const after=n.splitText(start); after.nodeValue=after.nodeValue.slice(word.length);
        const d=document.createElement("dfn"); d.className="term"; d.tabIndex=0; d.dataset.g=p.i; d.textContent=word; d.title=STUDY.gloss[p.i].d;
        after.parentNode.insertBefore(d,after);
        used.add(p.i); found.add(p.i); break;
      }
    }
  });
}
function showTip(i){const g=STUDY.gloss[i],t=$("#tip");t.innerHTML=`<b>${g.t}</b>${g.d}<button aria-label="Close">×</button>`;t.hidden=false;t.querySelector("button").onclick=()=>t.hidden=true}
document.addEventListener("click",e=>{const d=e.target.closest("dfn.term");if(d){showTip(+d.dataset.g);return}if(!e.target.closest("#tip"))$("#tip").hidden=true});
document.addEventListener("keydown",e=>{const d=e.target.closest&&e.target.closest("dfn.term");if(d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();showTip(+d.dataset.g)}if(e.key==="Escape")$("#tip").hidden=true});

function renderGlossary(){
  $("#main").innerHTML=`${menuBtn}<h1>Glossary</h1><p class="lede">${STUDY.gloss.length} terms used in the study notes. In the modules, terms with a dotted underline can be tapped for their definition.</p>
  <input class="search" id="gq" type="search" placeholder="Search terms" aria-label="Search terms"><div id="gl"></div>`;
  const draw=q=>{q=q.toLowerCase();$("#gl").innerHTML=STUDY.gloss.filter(g=>!q||(g.t+" "+g.a.join(" ")+" "+g.d).toLowerCase().includes(q)).map(g=>`<div class="gl"><b>${g.t}${g.a.length?` <small>(${g.a.join(", ")})</small>`:""}</b>${g.d}</div>`).join("")||"<p class='note'>No matching terms.</p>"};
  $("#gq").oninput=e=>draw(e.target.value); draw("");
}

function renderTopic(){
  const t=topOf(view.id), x=STUDY.exam[t.s], n=pool("t:"+t.id).length;
  const secs=t.refs.map(r=>{const [m,i]=r.split(":");return modOf(m).sections[+i]});
  $("#main").innerHTML=`${menuBtn}
    <p class="eyebrow">${x.title}</p><h1>${t.title}</h1>
    ${t.g?`<p class="lede">${t.g}</p>`:""}
    ${t.note?`<div class="gap">${t.note}</div>`:""}
    ${secs.map((s,i)=>`<details class="sec" ${i===0?"open":""}><summary>${s.t}</summary><div class="sec-body">${s.h}</div></details>`).join("")}
    ${t.rel.length?`<div class="panel"><h3>Related topics</h3>${t.rel.map(r=>`<button class="link" data-t="${r}">${topOf(r).title}</button>`).join("")}</div>`:""}
    <div class="actions">${n?`<button class="primary" id="mq">Practise this topic (${Math.min(n,10)} of ${n} questions)</button>`:`<p class="note">No quiz questions for this topic yet.</p>`}</div>`;
  const found=new Set(); annotate($("#main"),found);
  if(found.size){const kt=[...found].map(i=>STUDY.gloss[i]).sort((a,b)=>a.t.localeCompare(b.t));
    $("#main .actions").insertAdjacentHTML("beforebegin",`<details class="sec"><summary>Key terms in this topic (${kt.length})</summary><div class="sec-body"><dl class="kt">${kt.map(g=>`<dt>${g.t}</dt><dd>${g.d}</dd>`).join("")}</dl></div></details>`)}
  document.querySelectorAll("#main .link[data-t]").forEach(b=>b.onclick=()=>go({v:"topic",id:b.dataset.t}));
  if(n) $("#mq").onclick=()=>start("t:"+t.id,10);
  const gn=(STUDY.gen||[]).filter(c=>c.t===t.id).length;
  if(gn){$("#main .actions").insertAdjacentHTML("beforeend",`<button class="secondary" id="gq">Generate guide questions (${gn} fact sets)</button>`);$("#gq").onclick=()=>gstart("t:"+t.id,10,"both")}
}

function renderSetup(){
  const opts=[["all",STUDY.bank.length],...STUDY.exam.map(x=>["s:"+x.i,pool("s:"+x.i).length]),["missed",missed().length]];
  const best=store.get("best")||{};
  if(!setup.topic) setup.topic=STUDY.topics[0].id;
  $("#main").innerHTML=`${menuBtn}
    <h1>Practice exam</h1>
    <p class="lede">Questions are drawn at random from a library of ${STUDY.bank.length}. Every attempt gives you a new mix, and answer options are shuffled too.${best.all!=null?` Best full-exam score: ${best.all}%.`:""}</p>
    <div class="panel"><h3>What to practise</h3>
      ${opts.map(([id,c])=>`<label class="choice"><input type="radio" name="scope" value="${id}" ${setup.scope===id?"checked":""} ${c?"":"disabled"}>${scopeLabel(id)}<span class="c">${c?c+" in library":"none yet"}</span></label>`).join("")}
      <label class="choice"><input type="radio" name="scope" value="topic" ${setup.scope==="topic"?"checked":""}>One exam topic:
        <select id="modsel" style="max-width:100%">${STUDY.exam.map(x=>`<optgroup label="${x.title}">${x.groups.flatMap(g=>g.topics).map(t=>{const c=pool("t:"+t.id).length;return `<option value="${t.id}" ${setup.topic===t.id?"selected":""} ${c?"":"disabled"}>${t.title} (${c})</option>`}).join("")}</optgroup>`).join("")}</select></label>
    </div>
    <div class="panel"><h3>Number of questions</h3>
      <div class="seg">${[10,20,30,50].map(n=>`<button data-n="${n}" aria-pressed="${setup.size===n}">${n}</button>`).join("")}</div>
      <p class="note" id="cap"></p>
    </div>
    <div class="actions"><button class="primary" id="go">Start</button></div>`;
  const sc=()=>setup.scope==="topic"?"t:"+setup.topic:setup.scope;
  const cap=()=>{const c=pool(sc()).length;$("#cap").textContent=c<setup.size?`Only ${c} available for this choice, so you'll get ${c}.`:""};
  document.querySelectorAll("input[name=scope]").forEach(r=>r.onchange=()=>{setup.scope=r.value;cap()});
  $("#modsel").onchange=e=>{setup.topic=e.target.value;setup.scope="topic";document.querySelector("input[value=topic]").checked=true;cap()};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{setup.size=+b.dataset.n;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));cap()});
  $("#go").onclick=()=>start(sc(),setup.size);
  cap();
}

function start(scope,size){
  const qs=shuffle(pool(scope)).slice(0,size).map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});
  if(!qs.length) return;
  run={scope,size,qs,i:0,picked:[]};
  go({v:"run"});
}

function renderRun(){
  const q=run.qs[run.i], n=run.qs.length, p=run.picked[run.i], done=p!=null;
  const correct=run.picked.filter((x,i)=>x===run.qs[i].a).length;
  $("#main").innerHTML=`${menuBtn}
    <div class="run-top"><span>${scopeLabel(run.scope)}, question ${run.i+1} of ${n}</span><span>${correct} correct</span></div>
    <div class="bar"><i style="width:${(run.i+(done?1:0))/n*100}%"></i></div>
    <div class="q">
      <span class="tag">${topOf(q.t).title}</span>
      <p>${q.q}</p>
      ${q.o.map((o,j)=>`<button class="opt ${done&&j===q.a?"right":""} ${done&&j===p&&p!==q.a?"wrong":""}" data-j="${j}" ${done?"disabled":""}>${o}</button>`).join("")}
      ${done?`<div class="explain ${p===q.a?"":"no"}"><strong>${p===q.a?"Correct.":"Not quite."}</strong> ${q.e}</div>`:""}
    </div>
    <div class="actions">
      ${done?`<button class="primary" id="next">${run.i+1<n?"Next question":"See results"}</button>`:""}
      <button class="secondary" id="quit">End and see results</button>
    </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;run.picked[run.i]=j;markResult(q.id,j===q.a);renderRun();$("#next").focus()});
  if(done) $("#next").onclick=()=>{if(run.i+1<n){run.i++;renderRun()}else go({v:"result"})};
  $("#quit").onclick=()=>go({v:"result"});
}

function renderResult(){
  const ans=run.qs.map((q,i)=>({q,p:run.picked[i]})).filter(x=>x.p!=null);
  const ok=ans.filter(x=>x.p===x.q.a).length, pct=ans.length?Math.round(ok/ans.length*100):0;
  if(ans.length===run.qs.length){const b=store.get("best")||{};if(b[run.scope]==null||pct>b[run.scope]){b[run.scope]=pct;store.set("best",b)}}
  const byD={};ans.forEach(x=>{const d=byD[x.q.s]||(byD[x.q.s]={n:0,ok:0});d.n++;if(x.p===x.q.a)d.ok++});
  const wrong=ans.filter(x=>x.p!==x.q.a);
  $("#main").innerHTML=`${menuBtn}
    <h1>Results</h1>
    <div class="big">${pct}%</div>
    <p class="lede">${ok} of ${ans.length} answered correctly${ans.length<run.qs.length?` (${run.qs.length-ans.length} not answered)`:""}.</p>
    <div class="panel"><h3>By exam section</h3><div class="tbl"><table>
      <tr><th>Exam section</th><th>Score</th></tr>
      ${Object.entries(byD).map(([d,v])=>`<tr><td>${STUDY.exam[d].title}</td><td>${v.ok}/${v.n}</td></tr>`).join("")}
    </table></div></div>
    ${wrong.length?`<h2>Review what you missed</h2>${wrong.map(x=>`<div class="miss"><b>${x.q.q}</b>Correct answer: ${x.q.o[x.q.a]}. ${x.q.e}</div>`).join("")}`:""}
    <div class="actions">
      <button class="primary" id="again">New random set</button>
      <button class="secondary" id="back">Change practice options</button>
    </div>`;
  $("#again").onclick=()=>start(run.scope,run.size);
  $("#back").onclick=()=>go({v:"practice"});
}


/* ================= GUIDE QUESTION GENERATOR ================= */
STUDY.gen=(STUDY.gen||[]).filter(c=>topOf(c.t));STUDY.gen.forEach(c=>c.s2=topOf(c.t).s);
const SRCN={UIM:"Using Inventory Management",IMP:"Implementing Manufacturing and Supply Chain Materials Management"};
const srcKey=c=>c.src.split(" ")[0];
let gsetup={scope:"all",size:20,topic:"",src:"both"}, grun=null;
function gmissed(){return store.get("genmissed")||[]}
function gmark(id,ok){let m=new Set(gmissed());ok?m.delete(id):m.add(id);store.set("genmissed",[...m])}
function gpool(scope,src){
  let p=STUDY.gen;
  if(src&&src!=="both") p=p.filter(c=>srcKey(c)===src);
  if(scope==="missed"){const m=new Set(gmissed());return p.filter(c=>m.has(c.id))}
  if(scope.startsWith("t:")) return p.filter(c=>c.t===scope.slice(2));
  if(scope.startsWith("s:")) return p.filter(c=>c.s2===+scope.slice(2));
  return p;
}
function makeQ(c){
  let k=c.n;
  if(!k){const max=Math.min(c.r.length,3),x=Math.random();k=max===1?1:max===2?(x<.5?1:2):(x<.4?1:x<.72?2:3)}
  const nOpts=k===1?4:Math.min(5,k+c.w.length);
  const right=shuffle(c.r).slice(0,k), wrong=shuffle(c.w).slice(0,nOpts-k);
  const opts=shuffle([...right.map(t=>({t,ok:true})),...wrong.map(t=>({t,ok:false}))]);
  return {c,k,opts,picked:[],done:false,ok:null};
}
function gstart(scope,size,src){
  const pool=gpool(scope,src); if(!pool.length) return;
  let list=[]; while(list.length<size){list=list.concat(shuffle(pool)); if(pool.length<3&&list.length>=pool.length*3) break}
  grun={scope,size,src,qs:list.slice(0,size).map(makeQ),i:0};
  go({v:"genrun"});
}
function gscopeLabel(s){return s==="all"?"All exam sections":s==="missed"?"Generated questions I got wrong":s.startsWith("t:")?topOf(s.slice(2)).title:STUDY.exam[+s.slice(2)].title}
function renderGenSetup(){
  const srcs=[["both","Both guides"],["UIM",SRCN.UIM],["IMP",SRCN.IMP]];
  if(!gsetup.topic) gsetup.topic=(STUDY.gen[0]||{}).t||STUDY.topics[0].id;
  const opts=[["all"],...STUDY.exam.map(x=>["s:"+x.i]),["missed"]];
  $("#main").innerHTML=`${menuBtn}
    <h1>Guide question generator</h1>
    <p class="lede">Builds fresh multiple-choice questions from ${STUDY.gen.length} fact sets taken from the Oracle 26C guides <i>Using Inventory Management</i> and <i>Implementing Manufacturing and Supply Chain Materials Management</i>. Every run picks a different number of correct answers and a different set of distractors, so the same fact set rarely produces the same question twice. Each question tells you how many answers to choose; you only score when your selection is exactly right.</p>
    <div class="panel"><h3>Source guide</h3><div class="seg" id="gsrc">${srcs.map(([k,l])=>`<button data-s="${k}" aria-pressed="${gsetup.src===k}">${l}</button>`).join("")}</div></div>
    <div class="panel"><h3>What to practise</h3><div id="gscopes"></div>
      <label class="choice"><input type="radio" name="gscope" value="topic" ${gsetup.scope==="topic"?"checked":""}>One exam topic:
        <select id="gtop"></select></label></div>
    <div class="panel"><h3>Number of questions</h3>
      <div class="seg" id="gsize">${[10,20,30,50].map(n=>`<button data-n="${n}" aria-pressed="${gsetup.size===n}">${n}</button>`).join("")}</div>
      <p class="note">If you ask for more questions than there are fact sets, fact sets are reused — with a different mix of answers.</p></div>
    <div class="actions"><button class="primary" id="ggo">Generate</button></div>`;
  const draw=()=>{
    $("#gscopes").innerHTML=opts.map(([id])=>{const c=gpool(id,gsetup.src).length;return `<label class="choice"><input type="radio" name="gscope" value="${id}" ${gsetup.scope===id?"checked":""} ${c?"":"disabled"}>${gscopeLabel(id)}<span class="c">${c?c+" fact sets":"none"}</span></label>`}).join("");
    $("#gtop").innerHTML=STUDY.exam.map(x=>`<optgroup label="${x.title}">${x.groups.flatMap(g=>g.topics).map(t=>{const c=gpool("t:"+t.id,gsetup.src).length;return `<option value="${t.id}" ${gsetup.topic===t.id?"selected":""} ${c?"":"disabled"}>${t.title} (${c})</option>`}).join("")}</optgroup>`).join("");
    document.querySelectorAll("input[name=gscope]").forEach(r=>r.onchange=()=>gsetup.scope=r.value);
  };
  draw();
  $("#gtop").onchange=e=>{gsetup.topic=e.target.value;gsetup.scope="topic";document.querySelector("input[name=gscope][value=topic]").checked=true};
  document.querySelectorAll("#gsrc button").forEach(b=>b.onclick=()=>{gsetup.src=b.dataset.s;document.querySelectorAll("#gsrc button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  document.querySelectorAll("#gsize button").forEach(b=>b.onclick=()=>{gsetup.size=+b.dataset.n;document.querySelectorAll("#gsize button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#ggo").onclick=()=>gstart(gsetup.scope==="topic"?"t:"+gsetup.topic:gsetup.scope,gsetup.size,gsetup.src);
}
function renderGenRun(){
  const q=grun.qs[grun.i], n=grun.qs.length, correct=grun.qs.filter(x=>x.ok).length, multi=q.k>1;
  $("#main").innerHTML=`${menuBtn}
    <div class="run-top"><span>${gscopeLabel(grun.scope)}, question ${grun.i+1} of ${n}</span><span>${correct} correct</span></div>
    <div class="bar"><i style="width:${(grun.i+(q.done?1:0))/n*100}%"></i></div>
    <div class="q">
      <span class="tag">${topOf(q.c.t).title}</span><br>
      <span class="choose">Choose ${q.k}</span>
      <p>${q.c.s}</p>
      ${q.opts.map((o,j)=>{const p=q.picked.includes(j);let cls=multi?"":"radio";if(q.done){cls+=o.ok&&p?" right":!o.ok&&p?" wrong":o.ok?" missed":""}else if(p)cls+=" pick";
        return `<button class="opt ${cls}" data-j="${j}" ${q.done?"disabled":""} aria-pressed="${p}"><span class="box"></span>${o.t}${q.done&&o.ok&&!p?" <b>(correct — not selected)</b>":""}</button>`}).join("")}
      ${q.done?`<div class="explain ${q.ok?"":"no"}"><strong>${q.ok?"Correct.":"Not quite."}</strong> ${q.c.e}<div class="srcnote">Source: ${SRCN[srcKey(q.c)]} (26C), ${q.c.src.replace(/^\S+ /,"")}</div></div>`:`<p class="note" id="gsel">${q.picked.length} of ${q.k} selected</p>`}
    </div>
    <div class="actions">
      ${q.done?`<button class="primary" id="gnext">${grun.i+1<n?"Next question":"See results"}</button>`:`<button class="primary" id="gsub" ${q.picked.length===q.k?"":"disabled"}>Submit answer</button>`}
      <button class="secondary" id="gquit">End and see results</button>
    </div>`;
  if(!q.done) document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;
    if(q.picked.includes(j)) q.picked=q.picked.filter(x=>x!==j);
    else if(!multi) q.picked=[j];
    else if(q.picked.length<q.k) q.picked.push(j);
    else {$("#gsel").textContent=`You can choose only ${q.k}. Deselect one first.`;return}
    renderGenRun()});
  if(!q.done) $("#gsub").onclick=()=>{q.done=true;q.ok=q.picked.every(j=>q.opts[j].ok)&&q.picked.length===q.k;gmark(q.c.id,q.ok);renderGenRun();$("#gnext").focus()};
  else $("#gnext").onclick=()=>{if(grun.i+1<n){grun.i++;renderGenRun()}else go({v:"genresult"})};
  $("#gquit").onclick=()=>go({v:"genresult"});
}
function renderGenResult(){
  const ans=grun.qs.filter(q=>q.done), ok=ans.filter(q=>q.ok).length, pct=ans.length?Math.round(ok/ans.length*100):0;
  if(ans.length===grun.qs.length){const b=store.get("genbest")||{},key=grun.scope+"|"+grun.src;if(b[key]==null||pct>b[key]){b[key]=pct;store.set("genbest",b)}}
  const byD={};ans.forEach(q=>{const d=byD[q.c.s2]||(byD[q.c.s2]={n:0,ok:0});d.n++;if(q.ok)d.ok++});
  const multiN=ans.filter(q=>q.k>1), multiOk=multiN.filter(q=>q.ok).length;
  const wrong=ans.filter(q=>!q.ok);
  $("#main").innerHTML=`${menuBtn}
    <h1>Results</h1><div class="big">${pct}%</div>
    <p class="lede">${ok} of ${ans.length} answered fully correctly${ans.length<grun.qs.length?` (${grun.qs.length-ans.length} not answered)`:""}.${multiN.length?` Multiple-answer questions: ${multiOk} of ${multiN.length}.`:""}</p>
    <div class="panel"><h3>By exam section</h3><div class="tbl"><table><tr><th>Exam section</th><th>Score</th></tr>
      ${Object.entries(byD).map(([d,v])=>`<tr><td>${STUDY.exam[d].title}</td><td>${v.ok}/${v.n}</td></tr>`).join("")}</table></div></div>
    ${wrong.length?`<h2>Review what you missed</h2>${wrong.map(q=>`<div class="miss"><b>${q.c.s} (Choose ${q.k})</b>Correct: ${q.opts.filter(o=>o.ok).map(o=>o.t).join("; ")}.<br>${q.c.e}</div>`).join("")}`:""}
    <div class="actions"><button class="primary" id="gagain">Generate a new set</button><button class="secondary" id="gback">Change options</button></div>`;
  $("#gagain").onclick=()=>gstart(grun.scope,grun.size,grun.src);
  $("#gback").onclick=()=>go({v:"gen"});
}

document.querySelector(".nav-gen").onclick=()=>go({v:"gen"});
document.querySelector(".nav-practice").onclick=()=>go({v:"practice"});
document.querySelector(".nav-gloss").onclick=()=>go({v:"glossary"});
const t=store.get("theme");if(t)document.documentElement.dataset.theme=t;
$("#theme").onclick=()=>{const d=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const n=d?"light":"dark";document.documentElement.dataset.theme=n;store.set("theme",n)};
go(view);
</script>
